<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="HR Policy Bot — an agentic RAG assistant that checks its own answers" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffa657"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
      .flow{stroke-dasharray:4 8;animation:d 2s linear infinite}
      @keyframes d{to{stroke-dashoffset:-48}}
      .glow{animation:g 3s ease-in-out infinite}
      @keyframes g{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="379" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="44" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">🏢 HR Policy Bot</text>
  <rect x="216" y="26" width="140" height="24" rx="12" fill="none" stroke="#30363d"/>
  <text x="286" y="43" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">university project</text>
  <text x="28" y="76" class="sans" font-size="15" fill="#8b949e">An agentic RAG assistant that grades its own answers.</text>

  <!-- graph -->
  <g class="mono" text-anchor="middle">
    <rect x="28" y="104" width="120" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="88" y="128" font-size="13" fill="#c9d1d9">Retrieve</text>
    <text x="88" y="147" font-size="10" fill="#6e7681">ChromaDB search</text>
    <rect x="240" y="104" width="120" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="300" y="128" font-size="13" fill="#c9d1d9">Generate</text>
    <text x="300" y="147" font-size="10" fill="#6e7681">Llama 3.3 · Groq</text>
    <rect x="452" y="104" width="120" height="58" rx="8" fill="#161b22" stroke="#ffa657" class="glow"/>
    <text x="512" y="128" font-size="13" fill="#ffa657">Reflect</text>
    <text x="512" y="147" font-size="10" fill="#6e7681">self-evaluate</text>
  </g>
  <path class="flow" d="M148 133H236" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path class="flow" d="M360 133H448" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path class="flow" d="M512 162 C512 204 300 204 300 166" stroke="#ffa657" stroke-width="1.6" fill="none" marker-end="url(#ar2)"/>
  <text x="406" y="214" text-anchor="middle" class="mono" font-size="11" fill="#ffa657">retry if score &lt; 0.7 · max 2</text>

  <g class="sans" font-size="14">
    <circle cx="36" cy="248" r="4" fill="#58a6ff"/><text x="50" y="253" fill="#c9d1d9">LangGraph state machine, not a single prompt</text>
    <circle cx="36" cy="276" r="4" fill="#ffa657"/><text x="50" y="281" fill="#c9d1d9">Answers grounded in policy docs: leave, WFH, payroll</text>
    <circle cx="36" cy="304" r="4" fill="#7ee787"/><text x="50" y="309" fill="#c9d1d9">Reflection loop scores accuracy before replying</text>
  </g>
  <g class="mono" font-size="12">
    <text x="28" y="350" fill="#6e7681">LangGraph · Groq · ChromaDB · sentence-transformers · Streamlit</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
