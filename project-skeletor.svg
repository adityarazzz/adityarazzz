<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="Skeletor — static analysis that turns any codebase into an architecture map" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
      .flow{stroke:#7ee787;stroke-width:1.6;stroke-dasharray:4 8;animation:d 2s linear infinite}
      @keyframes d{to{stroke-dashoffset:-48}}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="379" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="44" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">💀 Skeletor</text>
  <rect x="166" y="26" width="58" height="24" rx="12" fill="none" stroke="#30363d"/>
  <text x="195" y="43" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">MIT</text>
  <rect x="232" y="26" width="72" height="24" rx="12" fill="none" stroke="#30363d"/>
  <text x="268" y="43" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">v0.1.0</text>
  <text x="28" y="76" class="sans" font-size="15" fill="#8b949e">Point it at a repo. Get the architecture back.</text>

  <!-- pipeline -->
  <g class="mono" font-size="12" text-anchor="middle">
    <rect x="28" y="100" width="104" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="120" fill="#c9d1d9">scan</text><text x="80" y="136" fill="#6e7681" font-size="10">11 languages</text>
    <rect x="172" y="100" width="104" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="224" y="120" fill="#c9d1d9">parse</text><text x="224" y="136" fill="#6e7681" font-size="10">tree-sitter AST</text>
    <rect x="316" y="100" width="104" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="368" y="120" fill="#c9d1d9">graph</text><text x="368" y="136" fill="#6e7681" font-size="10">networkx</text>
    <rect x="460" y="100" width="112" height="44" rx="8" fill="#161b22" stroke="#7ee787"/>
    <text x="516" y="120" fill="#7ee787">report</text><text x="516" y="136" fill="#6e7681" font-size="10">HTML · MD · .mmd</text>
  </g>
  <g fill="none">
    <path class="flow" d="M132 122H172"/><path class="flow" d="M276 122H316"/><path class="flow" d="M420 122H460"/>
  </g>

  <!-- findings -->
  <g class="sans" font-size="14">
    <circle cx="36" cy="182" r="4" fill="#58a6ff"/><text x="50" y="187" fill="#c9d1d9">Layer detection — controllers, services, repos, models</text>
    <circle cx="36" cy="212" r="4" fill="#f85149"/><text x="50" y="217" fill="#c9d1d9">Finds dead code, coupling hotspots, circular imports</text>
    <circle cx="36" cy="242" r="4" fill="#d2a8ff"/><text x="50" y="247" fill="#c9d1d9">Interactive dark-mode dashboard + Mermaid diagrams</text>
    <circle cx="36" cy="272" r="4" fill="#7ee787"/><text x="50" y="277" fill="#c9d1d9">MCP server, so AI coding agents can query the map</text>
  </g>

  <rect x="28" y="302" width="544" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="331" class="mono" font-size="14" fill="#8b949e">$ <tspan fill="#c9d1d9">uv tool install skeletor &amp;&amp; skeletor .</tspan></text>
  <text x="556" y="331" text-anchor="end" class="mono" font-size="12" fill="#58a6ff">Python ●</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
