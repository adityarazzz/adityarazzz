<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Aditya Raj — I build tools that help developers and AI agents understand code" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <clipPath id="type"><rect x="60" y="232" width="0" height="34">
      <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
      .edge{stroke:#30363d;stroke-width:1.5}
      .flow{stroke:url(#accent);stroke-width:2;stroke-dasharray:6 10;animation:dash 2.4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-64}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      .d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}
      @keyframes p{0%,100%{stroke-opacity:.4}50%{stroke-opacity:1}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x="640" y="1" width="559" height="338" rx="14" fill="url(#grid)" opacity=".6"/>

  <!-- left: identity -->
  <text x="60" y="78" class="mono" font-size="15" fill="#7ee787">~/adityarazzz $ whoami</text>
  <text x="58" y="138" class="sans" font-size="54" font-weight="700" fill="#f0f6fc">Aditya Raj</text>
  <rect x="60" y="154" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="194" class="sans" font-size="21" fill="#c9d1d9">I build tools that help developers and</text>
  <text x="60" y="222" class="sans" font-size="21" fill="#c9d1d9">AI agents <tspan fill="#58a6ff" font-weight="600">understand code</tspan>.</text>

  <g clip-path="url(#type)">
    <text x="60" y="256" class="mono" font-size="15" fill="#8b949e">$ skeletor ./legacy-app <tspan fill="#7ee787">→ 214 nodes · 3 cycles · 5 layers</tspan></text>
  </g>
  <rect x="60" y="242" width="9" height="18" fill="#7ee787" class="cursor" opacity=".8">
    <animate attributeName="x" values="60;578;578;60" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g class="mono" font-size="13">
    <rect x="60" y="284" width="148" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="134" y="304" text-anchor="middle" fill="#c9d1d9">Agentic AI · RAG</text>
    <rect x="218" y="284" width="148" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="292" y="304" text-anchor="middle" fill="#c9d1d9">Static analysis</text>
    <rect x="376" y="284" width="118" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="435" y="304" text-anchor="middle" fill="#c9d1d9">MCP tooling</text>
    <rect x="504" y="284" width="82" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="545" y="304" text-anchor="middle" fill="#c9d1d9">Python</text>
  </g>

  <!-- right: a living dependency graph -->
  <g>
    <line class="edge" x1="770" y1="90" x2="900" y2="150"/>
    <line class="edge" x1="900" y1="150" x2="1050" y2="100"/>
    <line class="edge" x1="900" y1="150" x2="840" y2="250"/>
    <line class="edge" x1="900" y1="150" x2="1000" y2="240"/>
    <line class="edge" x1="1050" y1="100" x2="1120" y2="190"/>
    <line class="edge" x1="1000" y1="240" x2="1120" y2="190"/>
    <line class="edge" x1="770" y1="90" x2="840" y2="250"/>
    <path class="flow" fill="none" d="M770 90 L900 150 L1000 240 L1120 190"/>
    <path class="flow" fill="none" d="M900 150 L1050 100" style="animation-delay:.8s"/>
  </g>
  <g class="mono" font-size="12" text-anchor="middle">
    <g class="pulse"><rect x="720" y="74" width="100" height="32" rx="8" fill="#161b22" stroke="#58a6ff"/><text x="770" y="95" fill="#58a6ff">controller</text></g>
    <g class="pulse d1"><rect x="855" y="134" width="90" height="32" rx="8" fill="#161b22" stroke="#7ee787"/><text x="900" y="155" fill="#7ee787">service</text></g>
    <g class="pulse d2"><rect x="1005" y="84" width="90" height="32" rx="8" fill="#161b22" stroke="#d2a8ff"/><text x="1050" y="105" fill="#d2a8ff">model</text></g>
    <g class="pulse d3"><rect x="785" y="234" width="110" height="32" rx="8" fill="#161b22" stroke="#ffa657"/><text x="840" y="255" fill="#ffa657">repository</text></g>
    <g class="pulse d4"><rect x="955" y="224" width="90" height="32" rx="8" fill="#161b22" stroke="#7ee787"/><text x="1000" y="245" fill="#7ee787">utils</text></g>
    <g class="pulse d2"><rect x="1080" y="174" width="80" height="32" rx="8" fill="#161b22" stroke="#f85149"/><text x="1120" y="195" fill="#f85149">db ⟲</text></g>
  </g>
  <text x="1160" y="318" text-anchor="end" class="mono" font-size="11" fill="#6e7681">rendered the way Skeletor sees a codebase</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
